<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DKP</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="heading"><img src="icons/icon.svg" width="38" height="38" alt="DKP" /><div><p class="eyebrow">DKP · CONTEXTS</p><h1>Add this page</h1></div></div>
      <p class="copy">Choose where this page belongs. DKP will analyse it after adding.</p>
      <div id="contexts" class="contexts"><p class="muted">Loading contexts…</p></div>
      <form id="new-context"><input id="context-name" maxlength="80" placeholder="New context name" required /><button type="submit">+ Create context</button></form>
      <a id="settings" href="#">Settings ↗</a>
      <p id="error" role="status" hidden></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
